plugins { id 'com.android.application' }

def ks = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ks.exists()) ksProps.load(new FileInputStream(ks))

android {
    namespace 'com.tinkeringdad.plaintv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tinkeringdad.plaintv'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
